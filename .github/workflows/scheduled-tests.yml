name: Scheduled Health Checks

# Run automated tests every 6 hours to detect issues proactively
on:
  schedule:
    # Run at 00:00, 06:00, 12:00, 18:00 UTC every day
    - cron: '0 */6 * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  # Golden Path Test - The most critical user flow
  golden-path:
    name: Golden Path Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Golden Path test
        id: golden-path-test
        run: npm run test:e2e -- e2e/golden-path.spec.ts --project=chromium
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ secrets.PRODUCTION_URL || 'https://buildmybot.app' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-path-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 90

      - name: Send alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Golden Path Test Failed';
            const body = `
            ## Critical Alert: Golden Path Test Failed

            The automated health check has detected a critical issue with BuildMyBot.

            **Test Run:** #${{ github.run_number }}
            **Time:** ${new Date().toISOString()}
            **URL:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### What This Means
            The core user journey (login → create bot → test chat → verify) is currently failing.
            This indicates a serious problem that needs immediate attention.

            ### Next Steps
            1. Review the test results in the Actions log
            2. Check Sentry for recent errors
            3. Verify production deployment status
            4. Contact the engineering team if needed

            ### Test Results
            See attached artifacts for detailed Playwright report.
            `;

            // Create an issue to track the failure
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'critical', 'automated-test-failure']
            });

  # Widget Integration Test
  widget-test:
    name: Widget Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Widget tests
        run: npm run test:e2e -- e2e/widget.spec.ts --project=chromium
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ secrets.PRODUCTION_URL || 'https://buildmybot.app' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-test-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

  # Link Health Check
  link-health:
    name: Link Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run link checker
        run: npm run check-links
        continue-on-error: true

      - name: Report broken links
        if: failure()
        run: echo "⚠️ Broken links detected. See logs for details."

  # Database Health Check
  database-health:
    name: Database Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Check Supabase status
        run: |
          echo "Checking Supabase status..."
          curl -f https://status.supabase.com/ || echo "⚠️ Supabase may be experiencing issues"

      - name: Test database connection
        run: |
          echo "Testing database connectivity (placeholder)"
          # Add actual database health check here
          # Example: curl -f $SUPABASE_URL/rest/v1/ -H "apikey: $SUPABASE_KEY"

  # Performance Benchmark
  performance:
    name: Performance Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          echo "Running Lighthouse performance audit..."
          # lhci autorun --config=.lighthouserc.json

      - name: Report performance metrics
        run: echo "📊 Performance metrics collected"
